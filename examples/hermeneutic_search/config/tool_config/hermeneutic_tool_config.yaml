tools:
  - class_name: examples.hermeneutic_search.tools.hermeneutic_search_tool.HermeneuticSearchTool
    config:
      retrieval_service_url: http://127.0.0.1:8000/retrieve
      num_workers: 120
      rate_limit: 120
      timeout: 30
      topk: 3
      type: native
    tool_schema:
      type: function
      function:
        name: search
        description: Search for information relevant to the current question.
        parameters:
          type: object
          properties:
            query_list:
              type: array
              items:
                type: string
              description: A list of search queries.
          required:
            - query_list
